name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install dependencies with npm ci (more reliable for CI/CD)
      - name: Install dependencies
        run: npm ci

      # Build the project
      - name: Build project
        run: npm run build
        env:
          CI: false

      # CRITICAL: List dist contents to verify build
      - name: Verify build output
        run: |
          echo "=== Checking dist folder ==="
          ls -la dist/
          echo ""
          echo "=== Checking index.html ==="
          head -5 dist/index.html
          echo ""
          echo "=== Dist size ==="
          du -sh dist/

      # Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NP_READER }}
          channelId: live
          projectId: np-reader
          entryPoint: ./
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # Verify deployment
      - name: Deployment Complete
        run: echo "✅ Deployed to https://np-reader.web.app"
